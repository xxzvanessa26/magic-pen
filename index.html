<title>Magic Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  :root{
    /* neutrals — for text/UI on paper (light) surfaces */
    --ink:#241C30;
    --ink-soft:#5C5369;
    --ink-faint:#948C9E;

    /* cream family — for text/UI on the dark cloth ground */
    --cream:#F7EFDC;
    --cream-soft:rgba(247,239,220,.76);
    --cream-faint:rgba(247,239,220,.42);

    /* cloth — the app's chrome ground, like library bookcloth */
    --cloth:#1F4A40;
    --cloth-deep:#153630;
    --cloth-light:#2C6156;
    --cloth-line:rgba(247,239,220,.14);

    /* gold — the one confident accent, like foil-stamped lettering */
    --gold:#E2A93E;
    --gold-deep:#BD8226;
    --gold-soft:#F0C876;
    --gold-tint:rgba(226,169,62,.16);

    /* paper — the actual page / book surfaces */
    --paper:#FBF4E6;
    --paper-white:#FFFDF8;
    --line:#E6D9BF;
    --line-soft:#EFE4CC;

    /* danger — delete actions only, kept apart from the brand accent */
    --berry:#B14432;
    --berry-deep:#93362A;

    --shadow-1: 0 2px 6px rgba(10,7,14,.14);
    --shadow-2: 0 12px 26px rgba(10,7,14,.24);
    --shadow-3: 0 22px 44px rgba(6,4,9,.34);
    --radius-page: 20px;

    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    --font-hand:'Caveat', cursive;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--cloth);
    color:var(--cream);
    font-family:var(--font-body);
    background-image:
      radial-gradient(120% 90% at 50% -14%, rgba(255,255,255,.07), transparent 62%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.03) 0 1px, transparent 1px 7px);
  }
  h1,h2,h3{ font-family:var(--font-display); font-optical-sizing:auto; margin:0; text-wrap:balance; }
  button{ font-family:inherit; }
  img{ max-width:100%; }
  ::selection{ background:var(--gold); color:var(--cloth-deep); }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ---------- layout shells ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  .wrap{ width:100%; max-width:1180px; margin:0 auto; padding:0 20px; }

  .brand{ display:flex; flex-direction:row; align-items:center; gap:26px; flex-wrap:wrap; }
  .brand-logo{ height:160px; width:auto; flex:none; }
  .brand-logo svg{ display:block; height:100%; width:auto; }
  .brand-text{ display:flex; flex-direction:column; gap:6px; }
  .brand-name{ font-size:clamp(1.9rem,3.4vw,2.8rem); font-weight:700; color:var(--cream); letter-spacing:-.01em; line-height:.95; }
  .brand-tagline{ margin:0; font-size:1.3rem; color:var(--cream-soft); font-style:italic; max-width:30ch; line-height:1.3; }
  .topline{ border-bottom:1px solid var(--cloth-line); padding:26px 0 28px; margin-bottom:6px; }
  @media (max-width:600px){ .brand-logo{ height:120px; } }

  /* ---------- gallery ---------- */
  .gallery-hero{
    padding:56px 0 50px;
    display:flex; align-items:center; justify-content:space-between; gap:40px; flex-wrap:wrap;
  }
  .gallery-hero-copy{ flex:1 1 420px; min-width:280px; }
  .gallery-hero h2{ font-size:clamp(3.2rem,7.4vw,5.8rem); color:var(--cream); line-height:.96; font-weight:600; letter-spacing:-.01em; }
  .gallery-hero h2 em{ font-style:italic; color:var(--gold-soft); }
  .gallery-hero p{ margin:22px 0 30px; color:var(--cream-soft); font-size:1.12rem; max-width:50ch; line-height:1.65; }
  .hero-badges{ display:flex; gap:22px; margin-top:26px; flex-wrap:wrap; }
  .hero-badge{ font-size:.84rem; font-weight:600; color:var(--cream-soft); display:inline-flex; align-items:center; gap:7px; }
  .hero-badge svg{ color:var(--gold); flex:none; }
  .gallery-hero-art{ flex:0 0 auto; display:flex; justify-content:center; padding:10px 24px; }

  /* ---------- book mockup (hardcover product-shot look) ---------- */
  .book-mockup{ position:relative; width:230px; transform:rotate(-3deg); transition:transform .25s ease; }
  .book-mockup:hover{ transform:rotate(-1deg) translateY(-4px); }
  .book-mockup .stack-edge{ position:absolute; inset:0; border-radius:4px 16px 16px 4px; box-shadow:var(--shadow-1); }
  .book-mockup .se1{ background:var(--paper); transform:translate(6px,7px); }
  .book-mockup .se2{ background:#EDE1C6; transform:translate(12px,13px); }
  .book-mockup .cover-face{
    position:relative; z-index:2; aspect-ratio:3/4; border-radius:4px 16px 16px 4px;
    box-shadow:var(--shadow-3); overflow:hidden; display:flex; flex-direction:column;
    background:var(--paper-white);
  }
  .book-mockup .cover-face::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:14%; z-index:4; pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0));
  }
  .book-mockup .cover-face::after{
    content:''; position:absolute; left:14%; top:0; bottom:0; width:2px; z-index:4; pointer-events:none;
    background:rgba(255,255,255,.4);
  }
  .book-mockup .ground-shadow{
    position:absolute; left:6%; right:0; bottom:-18px; height:22px; z-index:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.48), transparent 72%); filter:blur(4px);
  }
  .hero-mockup{ width:290px; }

  /* ---------- how it works (editorial numbered list, no cards) ---------- */
  .how-section{ padding:64px 0 8px; }
  .how-section h2{ font-size:2rem; color:var(--cream); font-weight:600; }
  .how-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:30px; }
  .how-step .num{ font-family:var(--font-display); font-optical-sizing:auto; font-weight:600; font-size:3rem; color:var(--gold); line-height:1; opacity:.95; }
  .how-step h3{ font-size:1.16rem; color:var(--cream); margin:10px 0 7px; font-weight:600; }
  .how-step p{ margin:0; font-size:.94rem; color:var(--cream-soft); line-height:1.55; max-width:34ch; }
  @media (max-width:700px){ .how-grid{ grid-template-columns:1fr; gap:28px; } .book-menu{ opacity:1; transform:none; } }

  .shelf-head{ padding:20px 0 0; }
  .shelf-head h2{ font-size:2rem; color:var(--cream); font-weight:600; }

  .empty-shelf{ grid-column:1/-1; text-align:center; padding:34px 10px 10px; color:var(--cream-soft); }
  .empty-shelf svg{ color:var(--gold); }
  .empty-shelf p{ font-size:.98rem; max-width:38ch; margin:14px auto 0; }

  .btn{
    font-family:var(--font-body);
    font-weight:700;
    border:none;
    border-radius:999px;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:9px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .btn-primary{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold) 70%); color:var(--cloth-deep);
    padding:16px 30px; font-size:1.08rem;
    box-shadow:0 10px 24px -8px rgba(226,169,62,.55), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 14px 28px -8px rgba(226,169,62,.65), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-primary:active{ transform:translateY(0) scale(.97); }
  .btn-danger{
    background:linear-gradient(180deg, #C4573F, var(--berry) 70%); color:#fff;
    padding:14px 24px; font-size:1rem;
    box-shadow:0 10px 22px -8px rgba(177,68,50,.55), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-danger:hover{ transform:translateY(-2px); }
  .btn-danger:active{ transform:translateY(0) scale(.97); }
  .btn-ghost{
    background:var(--paper-white); color:var(--ink);
    border:1.5px solid var(--line); padding:11px 18px; font-size:.95rem;
  }
  .btn-ghost:hover{ border-color:var(--cloth-light); color:var(--cloth-deep); }
  .btn-ghost:active{ transform:scale(.97); }
  .btn-outline{
    background:transparent; color:var(--cream); border:1.5px solid var(--cloth-line);
    padding:12px 20px; font-size:.98rem;
  }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold-soft); background:rgba(226,169,62,.08); }
  .btn-outline:active{ transform:scale(.97); }
  .btn-icon{
    background:rgba(247,239,220,.06); border:1.5px solid var(--cloth-line); color:var(--cream-soft);
    width:38px; height:38px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s ease;
  }
  .btn-icon:hover{ border-color:var(--gold); color:var(--gold-soft); background:rgba(226,169,62,.10); }
  .btn-icon:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-icon:disabled:hover{ border-color:var(--cloth-line); color:var(--cream-soft); background:rgba(247,239,220,.06); }

  .shelf{
    padding:8px 0 70px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:34px 24px;
  }
  .book-card{
    position:relative;
    aspect-ratio:3/4;
    cursor:pointer;
    transition:transform .18s ease;
  }
  .book-card .stack-edge{ position:absolute; inset:0; border-radius:4px 16px 16px 4px; box-shadow:var(--shadow-1); }
  .book-card .se1{ background:var(--paper); transform:translate(5px,6px); }
  .book-card .se2{ background:#EDE1C6; transform:translate(10px,11px); }
  .book-card .cover-face{
    position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
    border-radius:4px 16px 16px 4px; box-shadow:var(--shadow-2); overflow:hidden;
    background:var(--paper-white);
    transition:box-shadow .18s ease;
  }
  .book-card .cover-face::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:13%; z-index:4; pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,.24), rgba(0,0,0,0));
  }
  .book-card:nth-child(3n+1){ transform:rotate(-1.6deg); }
  .book-card:nth-child(3n+2){ transform:rotate(1deg); }
  .book-card:nth-child(3n+3){ transform:rotate(-0.6deg); }
  .book-card:hover{ transform:translateY(-7px) rotate(0deg); }
  .book-card:hover .cover-face{ box-shadow:var(--shadow-3); }
  .book-cover{
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    padding:18px 16px 8px;
  }
  .book-cover .scene{ font-size:3.6rem; filter:drop-shadow(0 6px 8px rgba(0,0,0,.14)); }
  .book-foot{ padding:12px 16px 16px; background:var(--paper-white); position:relative; z-index:1; }
  .book-title{
    font-family:var(--font-display); font-optical-sizing:auto; font-weight:600; font-size:1.08rem; line-height:1.18; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .book-author{ font-family:var(--font-hand); font-size:1.15rem; color:var(--ink-soft); margin-top:2px; }
  .book-pages{ font-size:.74rem; color:var(--ink-faint); margin-top:6px; letter-spacing:.3px; text-transform:uppercase; }
  .book-menu{
    position:absolute; top:10px; right:10px; z-index:5; display:flex; gap:6px;
    opacity:0; transform:translateY(-4px); transition:.15s ease;
  }
  .book-card:hover .book-menu, .book-card:focus-within .book-menu{ opacity:1; transform:translateY(0); }
  .mini-icon-btn{
    width:30px; height:30px; border-radius:9px; border:none; cursor:pointer;
    background:rgba(255,253,248,.94); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-1);
  }
  .mini-icon-btn:hover{ color:var(--cloth-deep); }
  .mini-icon-btn.danger:hover{ color:var(--berry); }

  .new-book-card{
    aspect-ratio:3/4; border-radius:16px; border:2px dashed var(--cloth-line);
    background:rgba(247,239,220,.03); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:var(--cream-soft); transition:.2s ease;
  }
  .new-book-card:hover{ border-color:var(--gold); color:var(--gold-soft); background:rgba(226,169,62,.06); }
  .new-book-card .plus-circle{
    width:50px; height:50px; border-radius:50%; background:rgba(226,169,62,.14);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
  }
  .new-book-card span{ font-family:var(--font-body); font-weight:700; font-size:.92rem; }

  /* ---------- editor ---------- */
  .editor{ display:flex; flex-direction:column; flex:1; }
  .editor-top{ display:flex; align-items:center; gap:12px; padding:18px 0 10px; flex-wrap:wrap; }
  .title-field{
    font-family:var(--font-display); font-optical-sizing:auto; font-weight:600; font-size:1.2rem; color:var(--cream);
    background:transparent; border:none; border-bottom:2px dashed transparent;
    padding:4px 2px; min-width:120px; flex:1;
  }
  .title-field::placeholder{ color:var(--cream-faint); }
  .title-field:hover, .title-field:focus{ border-color:var(--cloth-line); }
  .save-pill{
    font-size:.76rem; color:var(--gold-soft); background:var(--gold-tint);
    padding:6px 12px; border-radius:999px; font-weight:700; letter-spacing:.2px;
    display:flex; align-items:center; gap:6px; transition:opacity .3s ease;
  }
  .save-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); }

  .page-strip{
    display:flex; gap:10px; padding:4px 0 18px; overflow-x:auto; scrollbar-width:thin;
  }
  .page-thumb{
    flex:none; width:62px; height:82px; border-radius:7px; border:2px solid transparent;
    cursor:pointer; position:relative; overflow:hidden; box-shadow:var(--shadow-1);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
    transition:transform .15s ease, border-color .15s ease;
  }
  .page-thumb:hover{ transform:translateY(-3px); }
  .page-thumb.active{ border-color:var(--gold); }
  .page-thumb .pnum{
    position:absolute; bottom:2px; right:4px; font-size:.6rem; font-weight:700;
    color:rgba(0,0,0,.35); font-family:var(--font-body);
  }
  .page-thumb.cover-thumb::after{
    content:'COVER'; position:absolute; top:2px; left:0; right:0; text-align:center;
    font-size:.48rem; letter-spacing:.6px; font-weight:800; color:rgba(0,0,0,.42);
  }
  .add-page-btn{
    flex:none; width:62px; height:82px; border-radius:7px; border:2px dashed var(--cloth-line);
    background:transparent; cursor:pointer; color:var(--cream-faint);
    display:flex; align-items:center; justify-content:center; transition:.15s ease;
  }
  .add-page-btn:hover{ border-color:var(--gold); color:var(--gold-soft); }

  .editor-main{ display:flex; gap:28px; align-items:flex-start; padding-bottom:56px; flex:1; }
  .canvas-col{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .page-toolbar{ display:flex; gap:8px; align-items:center; }
  .page-toolbar .label{ font-family:var(--font-body); font-weight:700; color:var(--cream-soft); font-size:.85rem; }

  .canvas-shell{ width:100%; max-width:430px; position:relative; }
  .canvas-shell::after{
    content:''; position:absolute; left:10%; right:6%; bottom:-16px; height:22px; z-index:-1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 72%); filter:blur(5px);
  }
  .page-canvas{
    position:relative; width:100%; aspect-ratio:3/4; border-radius:var(--radius-page);
    box-shadow:var(--shadow-3), 0 30px 40px -20px rgba(0,0,0,.55); overflow:hidden; display:flex; flex-direction:column;
    transition:background .2s ease;
  }
  .page-canvas::after{
    content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-style:solid; border-width:0 26px 26px 0;
    border-color:transparent rgba(0,0,0,.08) transparent transparent;
    pointer-events:none;
  }
  .scene-zone{
    flex:0 0 68%; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .scene-zone .scene-emoji{ font-size:6.6rem; filter:drop-shadow(0 8px 10px rgba(0,0,0,.15)); display:inline-block; transition:transform .18s ease; }
  .scene-zone img.scene-photo{ width:100%; height:100%; object-fit:cover; }
  #scenePhoto{ cursor:grab; touch-action:none; user-select:none; -webkit-user-drag:none; transition:transform .18s ease; }
  #scenePhoto:active{ cursor:grabbing; }
  .photo-hint{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:rgba(21,54,48,.68); color:var(--cream); font-size:.7rem; font-weight:600;
    padding:5px 11px; border-radius:999px; display:flex; align-items:center; gap:5px;
    pointer-events:none;
  }
  .scene-empty{
    display:flex; flex-direction:column; align-items:center; gap:8px; color:rgba(36,28,48,.38);
    font-family:var(--font-body); font-weight:700; font-size:.85rem; text-align:center; padding:0 20px;
  }
  .text-zone{ flex:1; position:relative; padding:14px 20px 18px; display:flex; }
  .story-text{
    width:100%; resize:none; border:none; background:transparent; outline:none;
    font-family:var(--font-body); color:var(--ink); line-height:1.5;
    overflow-y:auto;
  }
  .story-text::placeholder{ color:rgba(36,28,48,.34); }
  .fs-sm{ font-size:.92rem; }
  .fs-md{ font-size:1.12rem; }
  .fs-lg{ font-size:1.38rem; }

  .cover-zone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px 22px 22px; text-align:center; }
  .cover-title-input{
    width:100%; text-align:center; font-family:var(--font-display); font-optical-sizing:auto; font-weight:700;
    font-size:1.55rem; color:var(--ink); background:transparent; border:none; outline:none; line-height:1.2;
  }
  .cover-title-input::placeholder{ color:rgba(36,28,48,.32); }
  .cover-by{ font-family:var(--font-hand); font-size:1.05rem; color:var(--ink-soft); }
  .cover-author-input{
    width:100%; text-align:center; font-family:var(--font-hand); font-size:1.4rem; color:var(--ink-soft);
    background:transparent; border:none; outline:none;
  }
  .cover-author-input::placeholder{ color:rgba(36,28,48,.3); }

  .sticker-layer{ position:absolute; inset:0; pointer-events:none; }
  .sticker{
    position:absolute; font-size:2rem; transform:translate(-50%,-50%);
    cursor:grab; pointer-events:auto; touch-action:none; user-select:none;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.18));
  }
  .sticker:active{ cursor:grabbing; }
  .sticker svg, .sticker img{ width:2rem; height:2rem; display:block; }
  .sticker-del{
    position:absolute; width:22px; height:22px; border-radius:50%; background:var(--berry-deep);
    color:#fff; border:2px solid #fff; font-size:.7rem; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:auto; box-shadow:var(--shadow-1); transform:translate(10px,-14px);
  }

  .canvas-hint{ font-size:.78rem; color:var(--cream-faint); text-align:center; }

  /* tool tray */
  .tray{ width:300px; flex:none; }
  .tray-card{ background:var(--paper-white); border-radius:18px; box-shadow:var(--shadow-2); overflow:hidden; }
  .tray-tabs{ display:flex; gap:4px; padding:10px 10px 8px; border-bottom:1px solid var(--line-soft); }
  .tray-tab{
    flex:1; background:transparent; border:none; padding:9px 4px 8px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.76rem; color:var(--ink-faint);
    display:flex; flex-direction:column; align-items:center; gap:4px; border-radius:11px 11px 0 0;
    transition:background .15s ease, color .15s ease;
  }
  .tray-tab.active{ color:var(--cloth-deep); background:var(--gold-tint); }
  .tray-body{ padding:16px; max-height:420px; overflow-y:auto; }
  .tray-body h4{ font-family:var(--font-body); font-size:.78rem; color:var(--ink-soft); margin:0 0 8px; letter-spacing:.5px; text-transform:uppercase; }
  .tray-section + .tray-section{ margin-top:16px; }
  .tray-lead{ font-size:.86rem; color:var(--ink-soft); line-height:1.5; margin:0 0 14px; }
  .tray-foot{
    border-top:1px solid var(--line-soft); padding:13px 16px 15px; font-size:.78rem;
    color:var(--ink-faint); line-height:1.5; display:flex; gap:8px; align-items:flex-start;
  }
  .tray-foot svg{ flex:none; margin-top:2px; color:var(--gold-deep); }

  .swatch-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .swatch{ aspect-ratio:1; border-radius:11px; border:2.5px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .swatch.active{ border-color:var(--cloth-deep); }

  .emoji-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .emoji-btn{

  function renderStickerResultsHtml(query){

    if (!matches.length){
      return '<p class="search-empty">No stickers found for "'+esc(query)+'". Try a different word, or draw your own!</p>' + drawBtn;
    }
    var heading = q ? (matches.length + " sticker" + (matches.length===1?"":"s") + " found") : "Tap to Add";
    var btns = matches.map(function(it){
      return '<button class="emoji-btn" data-add-sticker="'+esc(it.c)+'">'+stickerContentHtml(it.c)+'</button>';
    }).join("");
    return '<h4>'+heading+'</h4><div class="emoji-grid">'+btns+'</div>' + drawBtn;

  /* ---------------- undo ---------------- */

  var UNDO_LIMIT = 30;
  var undoStack = [];

  function resetUndo(){
    undoStack = [];
    refreshUndoBtn();
  }

  function snapshotBook(){
    var b = currentBook();
    if (!b) return;
    undoStack.push(JSON.parse(JSON.stringify(b)));
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    refreshUndoBtn();
  }

  function refreshUndoBtn(){
    var btn = document.getElementById("undoBtn");
    if (!btn) return;
    btn.disabled = undoStack.length === 0;
  }

  function doUndo(){
    if (!undoStack.length){ showToast("Nothing to undo yet."); return; }
    var prev = undoStack.pop();
    var idx = -1;
    for (var i=0;i<state.books.length;i++) if (state.books[i].id === prev.id) { idx = i; break; }
    if (idx === -1) return;
    state.books[idx] = prev;
    state.currentPageIndex = Math.min(state.currentPageIndex, prev.pages.length - 1);
    state.selectedStickerId = null;
    saveBooks(true);
    renderEditor();
    showToast("Undone.");
  }

    var tag = document.activeElement ? document.activeElement.tagName : "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    doUndo();

  function duplicateBook(id){
    var b = state.books.filter(function(x){return x.id===id;})[0];
    if (!b) return;
    var copy = JSON.parse(JSON.stringify(b));
    copy.id = uid();
    copy.title = b.title + " (Copy)";
    copy.pages.forEach(function(p){
      p.id = uid();
      p.stickers.forEach(function(s){ s.id = uid(); });
    });
    var idx = state.books.indexOf(b);
    state.books.splice(idx+1, 0, copy);
    saveBooks(true);
    render();
    showToast("Copied! Your new book is ready to edit.");
  }

  function addPage(){

  function deletePage(idx){
    var book = currentBook();
    if (book.pages.length <= 2){ showToast("Every book needs at least a cover and one story page!"); return; }
    if (idx === 0) return;
    snapshotBook();
    book.pages.splice(idx, 1);
    state.currentPageIndex = Math.max(0, idx - 1);
    saveBooks(true);
    renderEditor();
  }

  function movePage(dir){
    var book = currentBook();
    var i = state.currentPageIndex;
    var j = i + dir;
    if (i === 0 || j === 0 || j < 0 || j >= book.pages.length) return;
    snapshotBook();
    var tmp = book.pages[i]; book.pages[i] = book.pages[j]; book.pages[j] = tmp;
    state.currentPageIndex = j;
    saveBooks(true);
    renderEditor();
  }

      // Stop pointerdown/up from reaching the parent .sticker's drag handlers —
      // otherwise its own pointerup fires first, deselects, and re-renders the
      // canvas before this button's click can run, so the delete never happens.
      el.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      el.addEventListener("pointerup", function(e){ e.stopPropagation(); });
      el.addEventListener("click", function(e){
        e.stopPropagation();
        snapshotBook();
        page.stickers = page.stickers.filter(function(s){ return s.id !== el.getAttribute("data-del-sticker"); });

  function renderPageStripThumb(){

    el.innerHTML = (p.photo ? '<img src="'+p.photo+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">' : (p.sceneEmoji||"")) + '<span class="pnum">'+(state.currentPageIndex+1)+'</span>';
  }

  function bindStickerDrag(canvasEl, page){
    var dragId = null, moved = false, rect = null;

    canvasEl.querySelectorAll(".sticker").forEach(function(el){
      el.addEventListener("pointerdown", function(e){
        e.stopPropagation();
        dragId = el.getAttribute("data-sticker");
        moved = false;
        rect = canvasEl.getBoundingClientRect();
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener("pointermove", function(e){
        if (!dragId || el.getAttribute("data-sticker") !== dragId) return;
        if (!(e.buttons & 1) && e.pointerType === "mouse") return;
        moved = true;
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        x = Math.max(4, Math.min(96, x));
        y = Math.max(4, Math.min(96, y));
        el.style.left = x + "%";
        el.style.top = y + "%";
        el._pendingX = x; el._pendingY = y;
      });
      el.addEventListener("pointerup", function(e){
        if (dragId !== el.getAttribute("data-sticker")) return;
        if (moved && el._pendingX != null){
          var s = page.stickers.filter(function(s){return s.id===dragId;})[0];
          if (s){ snapshotBook(); s.x = el._pendingX; s.y = el._pendingY; }
          saveBooks(true);
        } else {
          state.selectedStickerId = (state.selectedStickerId === dragId) ? null : dragId;
          renderCanvas();
        }
        dragId = null; moved = false;
      });
    });

    canvasEl.addEventListener("click", function(e){
      if (e.target === canvasEl || e.target.closest(".scene-zone") && !e.target.closest(".sticker")){
        if (state.selectedStickerId){ state.selectedStickerId = null; renderCanvas(); }
      }
    });
  }

  function bindPhotoDrag(canvasEl, page){
    var img = canvasEl.querySelector("#scenePhoto");
    if (!img) return;
    var zone = img.parentElement;
    var dragging = false, moved = false, startY = 0, startPos = 50, zoneH = 0, pendingY = null;

    img.addEventListener("dragstart", function(e){ e.preventDefault(); });
    img.addEventListener("pointerdown", function(e){
      e.stopPropagation();
      dragging = true; moved = false;
      startY = e.clientY;
      startPos = (typeof page.photoY === "number") ? page.photoY : 50;
      zoneH = zone.getBoundingClientRect().height || 1;
      img.setPointerCapture(e.pointerId);
    });
    img.addEventListener("pointermove", function(e){
      if (!dragging) return;
      if (!(e.buttons & 1) && e.pointerType === "mouse") return;
      var dy = e.clientY - startY;
      if (Math.abs(dy) > 2) moved = true;
      var newPos = Math.max(0, Math.min(100, startPos - (dy / zoneH) * 100));
      pendingY = newPos;
      img.style.objectPosition = "center " + newPos + "%";
    });
    img.addEventListener("pointerup", function(e){
      if (!dragging) return;
      dragging = false;
      if (moved && pendingY != null){
        snapshotBook();
        page.photoY = pendingY;
        saveBooks(true);
        renderPageStripThumb();
      }
      moved = false; pendingY = null;
    });
  }

  function ensureFileInput(){
    if (fileInput) return fileInput;
    fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*";
    fileInput.style.display = "none";
    document.body.appendChild(fileInput);
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if (file) handlePhotoFile(file);
      fileInput.value = "";
    });
    return fileInput;
  }

  function handlePhotoFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxDim = 900;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL("image/jpeg", 0.78);
        var page = currentPage();
        snapshotBook();
        page.photo = dataUrl;
        page.photoY = 50;
        page.photoScale = 1;
        page.sceneEmoji = "";
        saveBooks(true);
        renderCanvas();
        renderPageStripThumb();
        var body = document.getElementById("trayBody");
        if (body){ body.innerHTML = renderTrayBody(); bindTrayBodyEvents(); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  var DRAW_COLORS = ["#241C30","#B14432","#E2A93E","#F5E6A8","#6FAE7C","#1F6F63","#C7DEF0","#6B4F94","#FFB3D1","#FFFDF8"];

  function openStickerDrawPanel(page, prefillLabel){
    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    var swatches = DRAW_COLORS.map(function(c, i){
      return '<button class="draw-color'+(i===0?' active':'')+'" style="background:'+c+'" data-draw-color="'+c+'" aria-label="color"></button>';
    }).join("");
    overlay.innerHTML =
      '<div class="modal-card draw-card">'+
        '<h3>Draw Your Own Sticker</h3>'+
        '<p>No sticker for that? Make one! Draw something small and simple.</p>'+
        '<canvas id="drawCanvas" width="260" height="260"></canvas>'+
        '<div class="draw-tools">'+
          '<div class="draw-colors">'+swatches+'</div>'+
          '<div class="draw-sizes">'+
            '<button class="draw-size-btn active" data-draw-size="4" aria-label="Thin brush"><span style="width:5px;height:5px;"></span></button>'+
            '<button class="draw-size-btn" data-draw-size="10" aria-label="Thick brush"><span style="width:11px;height:11px;"></span></button>'+
          '</div>'+
          '<button class="btn-icon" id="drawClearBtn" title="Clear drawing" aria-label="Clear drawing">'+ico("trash",16)+'</button>'+
        '</div>'+
        '<input class="draw-label-input" id="drawLabelInput" maxlength="24" placeholder="What is it? (like &quot;dragon&quot;)" value="'+esc(prefillLabel||"")+'">'+
        '<div class="modal-actions">'+
          '<button class="btn btn-ghost" id="drawCancelBtn">Cancel</button>'+
          '<button class="btn btn-primary" id="drawSaveBtn">'+ico("plus",16)+'<span>Add to My Page</span></button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) overlay.remove(); });
    document.getElementById("drawCancelBtn").onclick = function(){ overlay.remove(); };

    var canvas = document.getElementById("drawCanvas");
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFDF8";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    var drawColor = DRAW_COLORS[0];
    var drawSize = 4;
    var drawing = false, hasDrawn = false;

    function posFromEvent(e){
      var rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing = true; hasDrawn = true;
      var p = posFromEvent(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", function(e){
      if (!drawing) return;
      var p = posFromEvent(e);
      ctx.strokeStyle = drawColor;
      ctx.lineWidth = drawSize;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });
    canvas.addEventListener("pointerup", function(){ drawing = false; });

    Array.prototype.forEach.call(overlay.querySelectorAll("[data-draw-color]"), function(el){
      el.addEventListener("click", function(){
        drawColor = el.getAttribute("data-draw-color");
        Array.prototype.forEach.call(overlay.querySelectorAll("[data-draw-color]"), function(x){ x.classList.remove("active"); });
        el.classList.add("active");
      });
    });
    Array.prototype.forEach.call(overlay.querySelectorAll("[data-draw-size]"), function(el){
      el.addEventListener("click", function(){
        drawSize = parseInt(el.getAttribute("data-draw-size"), 10);
        Array.prototype.forEach.call(overlay.querySelectorAll("[data-draw-size]"), function(x){ x.classList.remove("active"); });
        el.classList.add("active");
      });
    });
    document.getElementById("drawClearBtn").onclick = function(){
      ctx.fillStyle = "#FFFDF8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
    };

    document.getElementById("drawSaveBtn").onclick = function(){
      if (!hasDrawn){ showToast("Draw something first!"); return; }
      var label = document.getElementById("drawLabelInput").value.trim();
      var dataUrl = canvas.toDataURL("image/png");
      CUSTOM_STICKERS.unshift({ id: uid(), dataUrl: dataUrl, label: label });
      saveCustomStickers();
      snapshotBook();
      page.stickers.push({
        id: uid(), emoji: dataUrl,
        x: 40 + Math.random()*20, y: 40 + Math.random()*20,
        rot: Math.round(Math.random()*20 - 10)
      });
      saveBooks(true);
      renderCanvas();
      overlay.remove();
      var resultsEl = document.getElementById("stickerResults");
      if (resultsEl){
        stickerQuery = "";
        var searchInput = document.getElementById("stickerSearchInput");
        if (searchInput) searchInput.value = "";
        resultsEl.innerHTML = renderStickerResultsHtml(stickerQuery);
        bindStickerAddButtons(resultsEl, page);
      }
      showToast("Your sticker is on the page — and saved under My Stickers!");
    };
  }

  /* ---------------- preview ---------------- */

  var previewIndex = 0;

  function renderPreviewPageInner(book, page, isCover){
    var sceneInner = page.photo
      ? '<img class="scene-photo" alt="" style="object-position:'+photoObjPos(page)+';transform:scale('+photoScale(page)+');" src="'+page.photo+'">'
      : (page.sceneEmoji
          ? '<span class="scene-emoji" style="display:inline-block;transform:scale('+photoScale(page)+');">'+page.sceneEmoji+'</span>'
          : '');
    var stickerHtml = page.stickers.map(function(s){
      return '<div class="sticker" style="left:'+s.x+'%;top:'+s.y+'%;transform:translate(-50%,-50%) rotate('+s.rot+'deg);">'+stickerContentHtml(s.emoji)+'</div>';
    }).join("");
    if (isCover){
      return (
        '<div class="scene-zone" style="flex:0 0 46%;">'+sceneInner+'</div>'+
        '<div class="cover-zone">'+
          '<div class="cover-title-input">'+esc(book.title||"Untitled Book")+'</div>'+
          '<div class="cover-by">written by</div>'+
          '<div class="cover-author-input">'+esc(book.author||"You")+'</div>'+
        '</div>'+
        '<div class="sticker-layer">'+stickerHtml+'</div>'
      );
    }
    return (
      '<div class="scene-zone">'+sceneInner+'</div>'+
      '<div class="text-zone">'+
        '<div class="story-text fs-'+(page.fontSize||"md")+'" style="color:'+(page.textColor||"#241C30")+';white-space:pre-wrap;height:100%;overflow-y:auto;">'+esc(page.text)+'</div>'+
      '</div>'+
      '<div class="sticker-layer">'+stickerHtml+'</div>'
    );
  }

  function renderPreviewStage(book){
    var page = book.pages[previewIndex];
    var isCover = previewIndex === 0;
    var wrap = document.getElementById("previewPageWrap");
    if (!wrap) return;
    wrap.innerHTML = '<div class="page-canvas" style="background:'+page.bg+';">'+renderPreviewPageInner(book, page, isCover)+'</div>';

    var countEl = document.getElementById("previewCount");
    if (countEl) countEl.textContent = (previewIndex+1) + " of " + book.pages.length;
    var prevBtn = document.getElementById("previewPrevBtn");
    if (prevBtn) prevBtn.disabled = previewIndex === 0;
    var nextBtn = document.getElementById("previewNextBtn");
    if (nextBtn) nextBtn.disabled = previewIndex === book.pages.length - 1;

    var dotsEl = document.getElementById("previewDots");
    if (dotsEl){
      dotsEl.innerHTML = book.pages.map(function(p, i){
        return '<button class="preview-dot'+(i===previewIndex?' active':'')+'" data-dot="'+i+'" aria-label="Go to page '+(i+1)+'"></button>';
      }).join("");
      Array.prototype.forEach.call(dotsEl.querySelectorAll("[data-dot]"), function(el){
        el.onclick = function(){ previewIndex = parseInt(el.getAttribute("data-dot"), 10); renderPreviewStage(book); };
      });
    }
  }

  function movePreview(book, dir){
    var next = previewIndex + dir;
    if (next < 0 || next >= book.pages.length) return;
    previewIndex = next;
    renderPreviewStage(book);
  }

  function previewKeyHandler(e){
    var book = currentBook();
    if (!book) return;
    if (e.key === "Escape") closePreview();
    else if (e.key === "ArrowLeft") movePreview(book, -1);
    else if (e.key === "ArrowRight") movePreview(book, 1);
  }

  function closePreview(){
    var overlay = document.getElementById("previewOverlay");
    if (overlay) overlay.remove();
    document.removeEventListener("keydown", previewKeyHandler);
  }

  function openPreview(){
    var book = currentBook();
    if (!book) return;
    previewIndex = state.currentPageIndex || 0;

    var overlay = document.createElement("div");
    overlay.className = "preview-overlay";
    overlay.id = "previewOverlay";
    overlay.innerHTML =
      '<div class="preview-top">'+
        '<button class="btn-icon" id="previewCloseBtn" aria-label="Close preview">'+ico("close",18)+'</button>'+
        '<div class="preview-title">'+esc(book.title||"Untitled Book")+'</div>'+
        '<button class="btn-icon" id="previewExportBtn" title="Export as PDF" aria-label="Export as PDF">'+ico("filePdf",18)+'</button>'+
        '<button class="btn btn-outline" id="previewPrintBtn">'+ico("printer",17)+'<span>Print Book</span></button>'+
      '</div>'+
      '<div class="preview-stage">'+
        '<button class="preview-nav-btn" id="previewPrevBtn" aria-label="Previous page">'+ico("chevronLeft",22)+'</button>'+
        '<div class="preview-page-wrap" id="previewPageWrap"></div>'+
        '<button class="preview-nav-btn" id="previewNextBtn" aria-label="Next page">'+ico("chevronRight",22)+'</button>'+
      '</div>'+
      '<div class="preview-footer">'+
        '<div class="preview-dots" id="previewDots"></div>'+
        '<div class="preview-count" id="previewCount"></div>'+
      '</div>';
    document.body.appendChild(overlay);

    document.getElementById("previewCloseBtn").onclick = closePreview;

    document.getElementById("previewExportBtn").onclick = exportPdf;
    overlay.addEventListener("click", function(e){ if (e.target === overlay) closePreview(); });
    document.addEventListener("keydown", previewKeyHandler);

  function buildPrintPageHtml(book, p, i){
    var stickerHtml = p.stickers.map(function(s){
      return '<div class="print-sticker" style="left:'+s.x+'%;top:'+s.y+'%;transform:translate(-50%,-50%) rotate('+s.rot+'deg);">'+stickerContentHtml(s.emoji)+'</div>';
    }).join("");
    var sceneInner = p.photo ? '<img src="'+p.photo+'" style="object-position:'+photoObjPos(p)+';transform:scale('+photoScale(p)+');">' : (p.sceneEmoji ? '<span class="scene-emoji" style="display:inline-block;transform:scale('+photoScale(p)+');">'+p.sceneEmoji+'</span>' : '');
    if (i === 0){
      return (
        '<div class="print-page" style="background:'+p.bg+'">'+
          '<div class="print-scene" style="flex:0 0 46%;">'+sceneInner+'</div>'+
          '<div class="print-cover"><div class="t">'+esc(book.title)+'</div><div class="a">'+esc(book.author)+'</div></div>'+
          stickerHtml+
        '</div>'
      );
    }
    return (
      '<div class="print-page" style="background:'+p.bg+'">'+
        '<div class="print-scene">'+sceneInner+'</div>'+
        '<div class="print-text">'+esc(p.text)+'</div>'+
        stickerHtml+

  function doPrint(){
    var book = currentBook();
    var pagesHtml = book.pages.map(function(p, i){ return buildPrintPageHtml(book, p, i); }).join("");

    saveBooks(true);

    // Printing has to happen in its own top-level tab: a dialog triggered
    // from inside this embedded page can be silently blocked, so we open a
    // standalone, fully self-contained print document instead.
    var doc =
      '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(book.title||"My Book")+'</title><style>'+
      '@page{ size:8.5in 11in; margin:0; }'+
      '*{box-sizing:border-box;}'+
      'body{ margin:0; background:#e9e4d8; font-family:\'Atkinson Hyperlegible\',-apple-system,sans-serif; }'+
      '.print-hint{ position:sticky; top:0; z-index:5; background:#153630; color:#F7EFDC; padding:14px 20px; text-align:center; font-size:.95rem; }'+
      '.print-hint strong{ color:#E2A93E; }'+
      '.print-page{ width:8.5in; height:11in; margin:14px auto; box-shadow:0 4px 18px rgba(0,0,0,.25); position:relative; overflow:hidden; display:flex; flex-direction:column; }'+
      '.print-scene{ flex:0 0 68%; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }'+
      '.print-scene .scene-emoji{ font-size:7.5rem; }'+
      '.print-scene img{ width:100%; height:100%; object-fit:cover; }'+
      '.print-text{ flex:1; padding:22px 34px; color:#241C30; line-height:1.55; white-space:pre-wrap; }'+
      '.print-cover{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }'+
      '.print-cover .t{ font-family:Georgia,serif; font-weight:700; font-size:2rem; color:#241C30; }'+
      '.print-cover .a{ font-family:cursive; font-size:1.6rem; color:#5C5369; margin-top:8px; }'+
      '.print-sticker{ position:absolute; font-size:2rem; transform:translate(-50%,-50%); }'+
      '.print-sticker svg, .print-sticker img{ width:2rem; height:2rem; display:block; }'+
      '@media print{ .print-hint{ display:none; } .print-page{ margin:0 auto; box-shadow:none; page-break-after:always; } .print-page:last-child{ page-break-after:auto; } body{ background:#fff; } }'+
      '</style></head><body>'+
      '<div class="print-hint">Your book is ready! If the print window didn\'t open on its own, press <strong>Ctrl+P</strong> (or <strong>Cmd+P</strong> on a Mac) to print or save as a PDF.</div>'+
      pagesHtml+
      '<script>window.addEventListener("load", function(){ setTimeout(function(){ window.print(); }, 250); });<\/script>'+
      '</body></html>';

    var blob = new Blob([doc], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var win = window.open(url, "_blank");
    if (!win){
      showToast("Please allow pop-ups for this page, then tap Print Book again.");
      return;
    }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }

  async function tryGetCapability(name){
    try{
      if (window.claude && typeof window.claude.use === "function"){
        return await window.claude.use(name);
      }
    } catch(e){}
    return null;
  }

  function showPdfOverlay(url, title){
    var overlay = document.createElement("div");
    overlay.className = "pdf-overlay";
    overlay.id = "pdfOverlay";
    overlay.innerHTML =
      '<div class="pdf-overlay-top">'+
        '<button class="btn-icon" id="pdfOverlayClose" aria-label="Close PDF preview">'+ico("close",18)+'</button>'+
        '<div class="pdf-overlay-title">'+esc(title||"Your Book PDF")+'</div>'+
      '</div>'+
      '<p class="pdf-overlay-hint">Your PDF is ready below! Use your browser\'s own download or print icon (usually in the top corner of the preview) to save it — or press and hold / right-click the page and choose "Save As".</p>'+
      '<iframe class="pdf-overlay-frame" src="'+url+'" title="'+esc(title||"Book PDF")+'"></iframe>';
    document.body.appendChild(overlay);
    document.getElementById("pdfOverlayClose").onclick = function(){
      overlay.remove();
      URL.revokeObjectURL(url);
    };
  }

  async function exportPdf(){
    var book = currentBook();
    if (!book) return;
    if (!window.html2canvas || !window.jspdf){
      showToast("PDF export isn't available right now — try Print Book instead.");
      return;
    }

    showToast("Creating your PDF… this can take a moment.");
    saveBooks(true);

    var stage = document.createElement("div");
    stage.className = "pdf-stage";
    document.body.appendChild(stage);

    try{
      var JsPdfCtor = window.jspdf.jsPDF;
      var pdf = new JsPdfCtor({ unit: "in", format: "letter" });

      for (var i = 0; i < book.pages.length; i++){
        stage.innerHTML = buildPrintPageHtml(book, book.pages[i], i);
        var pageEl = stage.querySelector(".print-page");
        var canvas = await window.html2canvas(pageEl, { scale: 2, useCORS: true });
        var imgData = canvas.toDataURL("image/jpeg", 0.92);
        if (i > 0) pdf.addPage("letter", "portrait");
        pdf.addImage(imgData, "JPEG", 0, 0, 8.5, 11);
      }

      var blob = pdf.output("blob");
      var fileBase = (book.title || "My Book").replace(/[\\/:*?"<>|]/g, "").trim() || "My Book";

      // Prefer the platform's own "save this file" prompt — it works
      // regardless of browser pop-up settings. Fall back to an in-page
      // viewer only when that capability isn't available here.
      var downloads = await tryGetCapability("downloads");
      if (downloads){
        try{
          await downloads.save({ filename: fileBase + ".pdf", data: blob });
          showToast("Your PDF was saved!");
        } catch(err){
          var code = err && err.code;
          if (code === "declined"){
            // they chose not to save — nothing more to do
          } else if (code === "too_large"){
            showToast("That PDF is too big to save here — try Print Book instead.");
          } else {
            showPdfOverlay(URL.createObjectURL(blob), book.title);
          }
        }
      } else {
        showPdfOverlay(URL.createObjectURL(blob), book.title);
      }
    } catch(e){
      showToast("Something went wrong making the PDF — try Print Book instead.");
    } finally {
      stage.remove();
    }
  }

  /* ---------------- boot ---------------- */

  state.books = loadBooks();
  CUSTOM_STICKERS = loadCustomStickers();
  saveBooks(true);
  render();

})();
</script>
